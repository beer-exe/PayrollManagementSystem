server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets
    location ~* \.(?:css|js|jpg|svg|png|gif|ico|woff2?|eot|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
